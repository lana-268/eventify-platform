x-app-environment: &app-environment
  DATABASE_URL: postgresql://eventify:eventify@db:5432/eventify?schema=public
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: compose-development-secret-at-least-32-characters
  WEB_ORIGIN: http://localhost:5173
  PORT: "3011"

x-app-service: &app-service
  build: .
  environment: *app-environment
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: eventify
      POSTGRES_PASSWORD: eventify
      POSTGRES_DB: eventify
    ports:
      - "5432:5432"
    volumes:
      - eventify-postgres:/var/lib/postgresql
      - ./session-3-sandbox-seed.sql:/docker-entrypoint-initdb.d/10-sandbox-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventify -d eventify"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *app-service
    command: ["sh", "-c", "npx prisma migrate deploy && npx prisma db seed"]
    restart: "no"

  api:
    <<: *app-service
    command: ["node", "dist/server.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "3011:3011"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3011/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    <<: *app-service
    command: ["node", "dist/worker.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  eventify-postgres:
